/* ============ IndexedDBラッパー(window.storageの代わり) ============ */
const DB_NAME = "beer_journal_db";
const STORE = "kv";
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGet(key) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, "readonly");
    const req = tx.objectStore(STORE).get(key);
    req.onsuccess = () => resolve(req.result === undefined ? null : req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSet(key, value) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).put(value, key);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}

/* ============ Firebase(Firestore)による端末間同期 ============ */
let FS = null; // 接続後、{ db, collection, doc, onSnapshot, setDoc, deleteDoc, query, orderBy, ... } を保持

async function connectFirebase(config) {
  const appMod = await import("https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js");
  const fsMod = await import("https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js");
  const authMod = await import("https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js");
  const app = appMod.initializeApp(config);
  const db = fsMod.getFirestore(app);
  try { await fsMod.enableIndexedDbPersistence(db); } catch (e) { /* 複数タブなどで失敗する場合は無視 */ }
  const auth = authMod.getAuth(app);
  await authMod.signInAnonymously(auth);
  FS = { db, ...fsMod };
  return true;
}

/* ============ 画像圧縮 ============ */
function compressImage(file, maxWidth = 380, quality = 0.55) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error);
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("画像の読み込みに失敗しました"));
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ============ 自分のAPIキーでClaudeに直接問い合わせ(ブラウザから直接) ============ */
/* 写真(ラベル)がある場合はラベルを読み取ってビール名も含めて推定する。
   写真が無い場合は入力済みのビール名だけを手がかりにWeb検索する。 */
async function fetchBeerInfo({ name, photos, apiKey }) {
  const schemaText = `出力形式(すべて日本語、値が不明な場合は空文字 "" にする):
{
  "name": "ビール名(正式名称)",
  "brewery": "醸造所名",
  "style": "ビアスタイル(例: PALE ALE, IPA, STOUT/PORTER, LAGERS など英語表記)",
  "region": "生産国または地域",
  "abv": "アルコール度数の数値のみ(例: 4.7)",
  "ibu": "IBU(苦味値)の数値のみ、不明なら空文字",
  "srm": "SRM値の数値のみ(例: 8)",
  "colorLabel": "色の簡潔な日本語表現(例: 非常に淡い, 淡い, 琥珀色, 濃い茶色, 黒に近い)",
  "adjuncts": "副原料があれば列挙、なければ特になし",
  "website": "公式サイトのURL、不明なら空文字"
}`;

  const validPhotos = (photos || []).filter(Boolean);
  let content;
  if (validPhotos.length > 0) {
    const imageBlocks = validPhotos.map((photo) => {
      const base64 = photo.split(",")[1] || "";
      const mediaMatch = photo.match(/^data:([^;]+);/);
      const mediaType = mediaMatch ? mediaMatch[1] : "image/jpeg";
      return { type: "image", source: { type: "base64", media_type: mediaType, data: base64 } };
    });
    content = [
      ...imageBlocks,
      { type: "text", text: `これらの画像はクラフトビールのボトルまたは缶の写真です(正面ラベル・背面ラベルなど複数枚の場合があります)。ラベルからビール名・ブリューワリー名を読み取り、Web検索でその他の情報を調べてJSONのみを出力してください（説明文やコードフェンスは一切不要）。${name ? `参考: ユーザーは「${name}」という名前を入力しています。これも手がかりにしてください。` : ""}\n\n${schemaText}` },
    ];
  } else {
    content = `あなたはクラフトビールのデータベース調査アシスタントです。ビール名「${name}」について、Web検索を使って以下の情報を調べ、JSONのみを出力してください（説明文やコードフェンスは一切不要）。\n\n${schemaText}`;
  }

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: "claude-haiku-4-5-20251001",
      max_tokens: 1200,
      messages: [{ role: "user", content }],
      tools: [{ type: "web_search_20250305", name: "web_search" }],
    }),
  });

  if (!response.ok) {
    const errText = await response.text().catch(() => "");
    throw new Error("APIエラー: " + response.status + " " + errText.slice(0, 200));
  }
  const data = await response.json();
  const text = (data.content || [])
    .map((b) => (b.type === "text" ? b.text : ""))
    .filter(Boolean)
    .join("\n");
  const clean = text.replace(/```json|```/g, "").trim();
  const m = clean.match(/\{[\s\S]*\}/);
  if (!m) throw new Error("情報を解析できませんでした");
  return JSON.parse(m[0]);
}

          key={i}
          type="button"
          onClick={onChange ? () => onChange(i) : undefined}
          disabled={!onChange}
          style={{

            lineHeight: 1,
            color: i <= value ? ACCENT : "#4A3C2C",
            padding: onChange ? 4 : 0,
            background: "none",
            border: "none",
          }}
        >
          {i <= value ? "★" : "☆"}
        </button>
      ))}
    </div>
  );
}

const SRM_STOPS = [
  [2, "#F3F993"], [4, "#F6F900"], [6, "#EAC100"], [9, "#E0A200"],
  [12, "#D5793A"], [15, "#C26128"], [18, "#A9491E"], [22, "#8D3319"],
  [26, "#6C2416"], [30, "#5A1E15"], [35, "#3F1710"], [40, "#1F0D0B"],
];
function srmToHex(srm) {
  const v = parseFloat(srm);
  if (isNaN(v)) return "#E8DFC8";
  for (const [stopV, hex] of SRM_STOPS) { if (v <= stopV) return hex; }
  return "#1F0D0B";
}

  const [detailId, setDetailId] = useState(null);
  const [error, setError] = useState("");
  const [fetching, setFetching] = useState(false);
  const [apiKey, setApiKey] = useState("");
  const [showKeyModal, setShowKeyModal] = useState(false);
  const [keyDraft, setKeyDraft] = useState("");
  const [infoLinks, setInfoLinks] = useState(DEFAULT_INFO_LINKS);
  const [infoImages, setInfoImages] = useState(DEFAULT_INFO_IMAGES);
  const [infoNotes, setInfoNotes] = useState([]);
  const [newLinkLabel, setNewLinkLabel] = useState("");
  const [newLinkUrl, setNewLinkUrl] = useState("");
  const [newNote, setNewNote] = useState("");
  const [fsConnected, setFsConnected] = useState(false);
  const [fsConnecting, setFsConnecting] = useState(false);
  const [fsConfigDraft, setFsConfigDraft] = useState("");
  const [fsError, setFsError] = useState("");
  const [localBackup, setLocalBackup] = useState([]);

  function attachFirestoreListeners() {
    const beersQuery = FS.query(FS.collection(FS.db, "beers"), FS.orderBy("createdAt", "desc"));
    FS.onSnapshot(beersQuery, (snap) => {
      setBeers(snap.docs.map((d) => ({ ...d.data(), id: d.id })));
    }, (e) => setFsError("同期エラー: " + e.message));

    FS.onSnapshot(FS.doc(FS.db, "infoMeta", "data"), (snap) => {
      const d = snap.data();
      if (d) {
        setInfoLinks(d.links || DEFAULT_INFO_LINKS);
        setInfoNotes(d.notes || []);
      } else {
        FS.setDoc(FS.doc(FS.db, "infoMeta", "data"), { links: DEFAULT_INFO_LINKS, notes: [] });
      }
    });

    FS.onSnapshot(FS.collection(FS.db, "infoImages"), (snap) => {
      if (snap.empty) {
        DEFAULT_INFO_IMAGES.forEach((img) => {
          FS.setDoc(FS.doc(FS.db, "infoImages", img.id), { caption: img.caption, src: img.src });
        });
      } else {
        setInfoImages(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
      }
    });
  }

  async function loadLocalFallback() {
    try {
      const stored = await idbGet("beers");
      if (stored) setBeers(JSON.parse(stored));
    } catch (e) { /* 初回は何もない */ }
    try {
      const info = await idbGet("info");
      if (info) {
        const parsed = JSON.parse(info);
        setInfoLinks(parsed.links || DEFAULT_INFO_LINKS);
        setInfoImages(parsed.images || DEFAULT_INFO_IMAGES);
        setInfoNotes(parsed.notes || []);
      } else {
        await idbSet("info", JSON.stringify({ links: DEFAULT_INFO_LINKS, images: DEFAULT_INFO_IMAGES, notes: [] }));
      }
    } catch (e) { /* 初回は何もない */ }
  }

  useEffect(() => {
    (async () => {
      const key = localStorage.getItem("anthropic_api_key") || "";
      setApiKey(key);

      const fsConfigStr = localStorage.getItem("firebase_config");
      if (fsConfigStr) {
        try {
          const config = JSON.parse(fsConfigStr);
          await connectFirebase(config);
          setFsConnected(true);
          attachFirestoreListeners();
        } catch (e) {
          setFsError("Firebaseへの接続に失敗しました。設定を確認してください。詳細: " + e.message);
          await loadLocalFallback();
        }
      } else {
        await loadLocalFallback();
      }
      setLoaded(true);
    })();
  }, []);

  // Firebaseコンソールのコピペ(JSリテラル形式・キー未クォート)や
  // 「const firebaseConfig = {...};」ごとの貼り付けにも対応した緩いパーサー
  function parseFirebaseConfig(text) {
    const trimmed = text.trim();
    try {
      return JSON.parse(trimmed);
    } catch (e) {
      const start = trimmed.indexOf("{");
      const end = trimmed.lastIndexOf("}");
      if (start === -1 || end === -1 || end < start) {
        throw new Error("設定の中に { } で囲まれた部分が見つかりませんでした。");
      }
      const body = trimmed.slice(start, end + 1);
      // eslint-disable-next-line no-new-func
      return new Function("return (" + body + ");")();
    }
  }

  async function handleConnectFirebase() {
    setFsError("");
    setFsConnecting(true);
    try {
      const config = parseFirebaseConfig(fsConfigDraft);
      if (!config || !config.projectId) throw new Error("projectId が見つかりません。貼り付けた内容をご確認ください。");
      setLocalBackup(beers);
      await connectFirebase(config);
      localStorage.setItem("firebase_config", JSON.stringify(config));
      setFsConnected(true);
      attachFirestoreListeners();
    } catch (e) {
      setFsError("接続に失敗しました。貼り付けた設定をご確認ください。詳細: " + e.message);
    } finally {
      setFsConnecting(false);
    }
  }

  async function migrateLocalToFirebase() {
    if (!FS) return;
    try {
      for (let i = 0; i < localBackup.length; i++) {
        const { id, ...rest } = localBackup[i];
        const docId = id || ("beer_" + Date.now() + "_" + i);
        await FS.setDoc(FS.doc(FS.db, "beers", docId), { ...rest, createdAt: Date.now() - i });
      }
      setLocalBackup([]);
    } catch (e) {
      setError("アップロードに失敗しました: " + e.message);
    }
  }

  async function persistInfo(next) {
    try { await idbSet("info", JSON.stringify(next)); } catch (e) { /* 保存失敗は静かに無視 */ }
  }
  async function addInfoLink() {
    if (!newLinkLabel.trim() || !newLinkUrl.trim()) return;
    const next = [...infoLinks, { id: "l_" + Date.now(), label: newLinkLabel.trim(), url: newLinkUrl.trim() }];
    if (fsConnected) {
      try { await FS.setDoc(FS.doc(FS.db, "infoMeta", "data"), { links: next, notes: infoNotes }); }
      catch (e) { setError("追加に失敗しました: " + e.message); }
    } else {
      setInfoLinks(next);
      persistInfo({ links: next, images: infoImages, notes: infoNotes });
    }
    setNewLinkLabel(""); setNewLinkUrl("");
  }
  async function deleteInfoLink(id) {
    const next = infoLinks.filter((l) => l.id !== id);
    if (fsConnected) {
      try { await FS.setDoc(FS.doc(FS.db, "infoMeta", "data"), { links: next, notes: infoNotes }); }
      catch (e) { setError("削除に失敗しました: " + e.message); }
    } else {
      setInfoLinks(next);
      persistInfo({ links: next, images: infoImages, notes: infoNotes });
    }
  }
  async function addInfoImage(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    try {
      const compressed = await compressImage(file, 900, 0.7);
      if (fsConnected) {
        const id = "img_" + Date.now();
        await FS.setDoc(FS.doc(FS.db, "infoImages", id), { caption: "", src: compressed });
      } else {
        const next = [...infoImages, { id: "img_" + Date.now(), caption: "", src: compressed }];
        setInfoImages(next);
        persistInfo({ links: infoLinks, images: next, notes: infoNotes });
      }
    } catch (err) {
      setError("画像の追加に失敗しました。");
    }
  }
  async function deleteInfoImage(id) {
    if (fsConnected) {
      try { await FS.deleteDoc(FS.doc(FS.db, "infoImages", id)); }
      catch (e) { setError("削除に失敗しました: " + e.message); }
    } else {
      const next = infoImages.filter((i) => i.id !== id);
      setInfoImages(next);
      persistInfo({ links: infoLinks, images: next, notes: infoNotes });
    }
  }
  async function addInfoNote() {
    if (!newNote.trim()) return;
    const next = [{ id: "note_" + Date.now(), text: newNote.trim(), datetime: new Date().toISOString() }, ...infoNotes];
    if (fsConnected) {
      try { await FS.setDoc(FS.doc(FS.db, "infoMeta", "data"), { links: infoLinks, notes: next }); }
      catch (e) { setError("追加に失敗しました: " + e.message); }
    } else {
      setInfoNotes(next);
      persistInfo({ links: infoLinks, images: infoImages, notes: next });
    }
    setNewNote("");
  }
  async function deleteInfoNote(id) {
    const next = infoNotes.filter((n) => n.id !== id);
    if (fsConnected) {
      try { await FS.setDoc(FS.doc(FS.db, "infoMeta", "data"), { links: infoLinks, notes: next }); }
      catch (e) { setError("削除に失敗しました: " + e.message); }
    } else {
      setInfoNotes(next);
      persistInfo({ links: infoLinks, images: infoImages, notes: next });
    }
  }

  async function persist(next) {
    setBeers(next);
    try {
      await idbSet("beers", JSON.stringify(next));
      setError("");
    } catch (e) {
      setError("保存に失敗しました。ブラウザのストレージ設定をご確認ください。");
    }
  }

  function saveApiKey() {
    localStorage.setItem("anthropic_api_key", keyDraft.trim());
    setApiKey(keyDraft.trim());
    setShowKeyModal(false);
  }

  function startAdd() {
    setForm({ ...EMPTY_FORM, datetime: new Date().toISOString().slice(0, 16) });
    setEditingId(null);
    setError("");
    setScreen("form");
  }
  function startEdit(beer) {
    setForm({ ...beer });
    setEditingId(beer.id);
    setError("");
    setScreen("form");
  }
  function openDetail(id) {
    setDetailId(id);
    setScreen("detail");
  }

  async function handleAutoFetch() {
    const hasPhoto = form.photos.some(Boolean);
    if (!form.name.trim() && !hasPhoto) { setError("先に写真を選ぶか、ビール名を入力してください。"); return; }
    if (!apiKey) { setShowKeyModal(true); return; }
    setFetching(true);
    setError("");
    try {
      const info = await fetchBeerInfo({ name: form.name.trim(), photos: form.photos, apiKey });
      setForm((f) => ({
        ...f,
        name: f.name.trim() ? f.name : (info.name || f.name),
        brewery: info.brewery || f.brewery,
        style: info.style || f.style,
        region: info.region || f.region,
        abv: info.abv || f.abv,
        ibu: info.ibu || f.ibu,
        srm: info.srm || f.srm,
        colorLabel: info.colorLabel || f.colorLabel,
        adjuncts: info.adjuncts || f.adjuncts,
        website: info.website || f.website,
      }));
    } catch (e) {
      setError("情報を取得できませんでした(" + e.message + ")。手動で入力してください。");
    } finally {
      setFetching(false);
    }
  }

  async function handleSave() {
    if (!form.name.trim()) { setError("ビール名を入力してください。"); return; }
    if (fsConnected) {
      try {
        const id = editingId || ("beer_" + Date.now());
        const prevCreatedAt = editingId ? (beers.find((b) => b.id === editingId) || {}).createdAt : null;
        await FS.setDoc(FS.doc(FS.db, "beers", id), { ...form, createdAt: prevCreatedAt || Date.now() });
      } catch (e) {
        setError("保存に失敗しました: " + e.message);
        return;
      }
    } else {
      const next = editingId
        ? beers.map((b) => (b.id === editingId ? { ...form, id: editingId } : b))
        : [{ ...form, id: "beer_" + Date.now() }, ...beers];
      await persist(next);
    }
    setScreen("list");
  }
  async function handleDelete(id) {
    if (fsConnected) {
      try { await FS.deleteDoc(FS.doc(FS.db, "beers", id)); } catch (e) { setError("削除に失敗しました: " + e.message); }
    } else {
      await persist(beers.filter((b) => b.id !== id));
    }
    setScreen("list");
  }
  async function handlePhoto(index, e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    try {
      const compressed = await compressImage(file);
      setForm((f) => {
        const photos = [...f.photos];
        photos[index] = compressed;
        return { ...f, photos };
      });
    } catch (err) {
      setError("画像の処理に失敗しました。別の写真でお試しください。");
    }
  }

  const byRating = useMemo(() => {
    const groups = {};
    beers.forEach((b) => { const k = b.rank || 0; (groups[k] = groups[k] || []).push(b); });
    return Object.keys(groups).sort((a, b) => b - a).map((k) => ({ key: k, items: groups[k] }));
  }, [beers]);

  const byStyle = useMemo(() => {
    const groups = {};
    beers.forEach((b) => { const k = (b.style || "未分類").toUpperCase(); (groups[k] = groups[k] || []).push(b); });
    return Object.keys(groups).sort().map((k) => ({ key: k, items: groups[k] }));
  }, [beers]);

  const detail = beers.find((b) => b.id === detailId);

  return (
    <div style={{ minHeight: "100vh", background: BG, color: TEXT, fontFamily: "'Work Sans', sans-serif", paddingBottom: 80 }}>

      {showKeyModal && (
        <div className="fixed inset-0 z-50 flex items-center justify-center px-6" style={{ background: "rgba(0,0,0,0.6)" }}>
          <div className="w-full rounded-2xl p-5 overflow-y-auto" style={{ background: CARD, border: `1px solid ${BORDER}`, maxWidth: 380, maxHeight: "85vh" }}>
            <h3 style={{ fontFamily: "'Fraunces', serif", fontWeight: 700, fontSize: 18 }}>Anthropic APIキー</h3>
            <p style={{ fontSize: 12, color: MUTED, marginTop: 6, lineHeight: 1.6 }}>
              「自動取得」機能を使うには、ご自身のAnthropic APIキーが必要です。console.anthropic.com で発行できます。キーはこの端末のブラウザ内にのみ保存され、外部には送信されません。
            </p>
            <input
              value={keyDraft}
              onChange={(e) => setKeyDraft(e.target.value)}
              placeholder="sk-ant-..."
              style={{ width: "100%", background: CARD2, border: `1px solid ${BORDER}`, borderRadius: 10, padding: "10px 12px", color: TEXT, fontSize: 13, marginTop: 12, outline: "none" }}
            />
            <div className="flex gap-2 mt-4">
              <button onClick={() => setShowKeyModal(false)} className="flex-1 py-2.5 rounded-xl" style={{ background: CARD2, color: TEXT, fontSize: 13, fontWeight: 600 }}>
                キャンセル
              </button>
              <button onClick={saveApiKey} className="flex-1 py-2.5 rounded-xl" style={{ background: ACCENT, color: BG, fontSize: 13, fontWeight: 700 }}>
                保存
              </button>
            </div>

            <div style={{ borderTop: `1px solid ${BORDER}`, marginTop: 20, paddingTop: 16 }}>
              <h3 style={{ fontFamily: "'Fraunces', serif", fontWeight: 700, fontSize: 16 }}>端末間の同期(Firebase)</h3>
              {fsConnected ? (
                <p style={{ fontSize: 12, color: ACCENT, marginTop: 6 }}>✓ 接続済み・自動で同期されています</p>
              ) : (
                <>
                  <p style={{ fontSize: 12, color: MUTED, marginTop: 6, lineHeight: 1.6 }}>
                    Firebaseの設定(firebaseConfig)を貼り付けると、他の端末ともデータが自動で同期されます。Firebaseコンソールに表示された<code style={{ fontSize: 11 }}>{"{ apiKey: ... }"}</code>の部分をそのままコピペしてOKです(前後にconstなどが付いていても構いません)。同じ設定をすべての端末で貼り付けてください。
                  </p>
                  <textarea
                    value={fsConfigDraft}
                    onChange={(e) => setFsConfigDraft(e.target.value)}
                    rows={5}
                    placeholder='{"apiKey": "...", "authDomain": "...", "projectId": "...", ...}'
                    style={{ width: "100%", background: CARD2, border: `1px solid ${BORDER}`, borderRadius: 10, padding: "10px 12px", color: TEXT, fontSize: 12, marginTop: 10, outline: "none", fontFamily: "monospace" }}
                  />
                  {fsError && <p style={{ color: "#D97757", fontSize: 11, marginTop: 6 }}>{fsError}</p>}
                  <button onClick={handleConnectFirebase} disabled={fsConnecting} className="w-full py-2.5 rounded-xl mt-3" style={{ background: fsConnecting ? "#4A3C2C" : ACCENT, color: BG, fontSize: 13, fontWeight: 700 }}>
                    {fsConnecting ? "接続中…" : "接続する"}
                  </button>
                </>
              )}
              {fsConnected && localBackup.length > 0 && (
                <div className="rounded-xl p-3 mt-3" style={{ background: CARD2, border: `1px solid ${BORDER}` }}>
                  <p style={{ fontSize: 12, color: MUTED, marginBottom: 8 }}>この端末にあった{localBackup.length}件のローカルデータをFirebaseへアップロードしますか？</p>
                  <button onClick={migrateLocalToFirebase} className="w-full py-2 rounded-xl" style={{ background: ACCENT, color: BG, fontSize: 12.5, fontWeight: 700 }}>
                    アップロードする
                  </button>
                </div>
              )}
            </div>
          </div>
        </div>
      )}

      {screen === "list" && (
        <>
          <header className="px-5 pt-6 pb-4 sticky top-0 z-10" style={{ background: `linear-gradient(180deg, ${BG} 75%, rgba(27,22,17,0))` }}>
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2">
                <span style={{ fontSize: 22 }}>🍺</span>
                <h1 style={{ fontFamily: "'Fraunces', serif", fontWeight: 700, fontSize: 24 }}>
                  {tab === "collection" ? "Beer Book" : tab === "rating" ? "By Rating" : tab === "style" ? "By Style" : "Info"}
                </h1>
              </div>
              <div className="flex items-center gap-2">
                <button onClick={() => { setKeyDraft(apiKey); setShowKeyModal(true); }} className="flex items-center justify-center rounded-full relative" style={{ width: 34, height: 34, background: CARD, border: `1px solid ${BORDER}`, color: MUTED, fontSize: 14 }} title="設定">
                  ⚙
                  {fsConnected && <span style={{ position: "absolute", top: -1, right: -1, width: 8, height: 8, borderRadius: "50%", background: ACCENT, border: `1.5px solid ${BG}` }} />}
                </button>
                <button onClick={startAdd} className="flex items-center gap-1 rounded-full" style={{ background: ACCENT, color: BG, fontWeight: 700, fontSize: 13, padding: "8px 14px" }}>
                  ＋ New
                </button>
              </div>
            </div>
            {beers.length > 0 && (
              <p style={{ color: MUTED, fontSize: 11, marginTop: 10 }}>{beers.length}杯 記録済み</p>
            )}
          </header>

          <main className="px-5">
            {!loaded && <p style={{ color: MUTED, fontSize: 13 }}>読み込み中…</p>}

            {loaded && beers.length === 0 && tab !== "info" && (
              <div className="mt-16 text-center" style={{ color: FAINT }}>
                <div style={{ fontSize: 40, opacity: 0.5, marginBottom: 12 }}>🍺</div>
                <p style={{ fontFamily: "'Fraunces', serif", fontSize: 18, color: MUTED }}>まだ記録がありません</p>
                <p style={{ fontSize: 13, marginTop: 4 }}>右上の ＋New から最初の一杯を記録しましょう</p>
              </div>
            )}

            {loaded && beers.length > 0 && tab === "collection" && (
              <div className="grid grid-cols-2 gap-3">
                {beers.map((b) => (
                  <button key={b.id} onClick={() => openDetail(b.id)} className="text-left rounded-2xl overflow-hidden" style={{ background: CARD, border: `1px solid ${BORDER}` }}>
                    <div className="w-full flex items-center justify-center" style={{ height: 100, background: CARD2 }}>
                      {b.photos && b.photos[0] ? <img src={b.photos[0]} alt={b.name} className="w-full h-full object-cover" /> : <span style={{ fontSize: 22 }}>🍺</span>}
                    </div>
                    <div className="p-2.5">
                      <EyebrowRow brewery={b.brewery} />
                      <p className="truncate" style={{ fontFamily: "'Fraunces', serif", fontWeight: 700, fontSize: 14.5, marginTop: 2 }}>{b.name}</p>
                      <div className="flex items-center justify-between" style={{ marginTop: 5 }}>
                        <span className="truncate" style={{ color: MUTED, fontSize: 9.5 }}>{[b.style, b.abv && `${b.abv}%`].filter(Boolean).join(" · ")}</span>
                        {b.price && <span style={{ color: FAINT, fontSize: 9.5, fontFamily: "monospace" }}>¥{b.price}</span>}
                      </div>
                    </div>
                  </button>
                ))}
              </div>
            )}

            {loaded && beers.length > 0 && tab === "rating" && byRating.map((group) => (
              <div key={group.key} className="mb-5">
                <h2 style={{ fontFamily: "'Fraunces', serif", fontWeight: 700, fontSize: 22, marginBottom: 8 }}>{group.key}</h2>
                <div className="flex flex-col">
                  {group.items.map((b) => (
                    <button key={b.id} onClick={() => openDetail(b.id)} className="flex items-center gap-3 py-3 text-left" style={{ borderBottom: `1px solid ${BORDER}` }}>
                      <div className="shrink-0 rounded-xl overflow-hidden flex items-center justify-center" style={{ width: 48, height: 48, background: CARD2 }}>
                        {b.photos && b.photos[0] ? <img src={b.photos[0]} alt={b.name} className="w-full h-full object-cover" /> : <span>🍺</span>}
                      </div>
                      <div className="flex-1 min-w-0">
                        <EyebrowRow brewery={b.brewery} style={b.style} />
                        <p className="truncate" style={{ fontWeight: 700, fontSize: 15 }}>{b.name}</p>
                        {b.impression && <p className="truncate" style={{ color: MUTED, fontSize: 12.5 }}>{b.impression}</p>}
                      </div>
                    </button>
                  ))}
                </div>
              </div>
            ))}

            {loaded && beers.length > 0 && tab === "style" && byStyle.map((group) => (
              <div key={group.key} className="mb-5">
                <h2 style={{ fontFamily: "'Fraunces', serif", fontWeight: 700, fontSize: 18, marginBottom: 8, color: ACCENT }}>{group.key}</h2>
                <div className="flex flex-col">
                  {group.items.map((b) => (
                    <button key={b.id} onClick={() => openDetail(b.id)} className="flex items-center gap-3 py-3 text-left" style={{ borderBottom: `1px solid ${BORDER}` }}>
                      <div className="shrink-0 rounded-xl overflow-hidden flex items-center justify-center" style={{ width: 48, height: 48, background: CARD2 }}>
                        {b.photos && b.photos[0] ? <img src={b.photos[0]} alt={b.name} className="w-full h-full object-cover" /> : <span>🍺</span>}
                      </div>
                      <div className="flex-1 min-w-0">
                        <p className="truncate" style={{ color: MUTED, fontSize: 11 }}>{b.brewery || "不明"}</p>
                        <p className="truncate" style={{ fontWeight: 700, fontSize: 15 }}>{b.name}</p>
                      </div>
                      <StarRating value={b.rank} size={13} />
                    </button>
                  ))}
                </div>
              </div>
            ))}

            {loaded && tab === "info" && (
              <div className="pb-6">
                <h2 style={{ fontFamily: "'Fraunces', serif", fontWeight: 700, fontSize: 16, marginBottom: 8, color: ACCENT }}>LINKS</h2>
                <div className="flex flex-col gap-2 mb-3">
                  {infoLinks.map((l) => (
                    <div key={l.id} className="flex items-center gap-2 rounded-xl px-3 py-2.5" style={{ background: CARD, border: `1px solid ${BORDER}` }}>
                      <a href={l.url} target="_blank" rel="noreferrer" className="flex-1 truncate" style={{ color: ACCENT, fontSize: 13.5, fontWeight: 600 }}>{l.label}</a>
                      <button onClick={() => deleteInfoLink(l.id)} style={{ color: FAINT, fontSize: 13, padding: 4 }}>✕</button>
                    </div>
                  ))}
                </div>
                <div className="rounded-xl p-3 mb-8" style={{ background: CARD, border: `1px solid ${BORDER}` }}>
                  <div className="flex flex-col gap-2">
                    <input value={newLinkLabel} onChange={(e) => setNewLinkLabel(e.target.value)} placeholder="リンク名" style={inputStyle} />
                    <input value={newLinkUrl} onChange={(e) => setNewLinkUrl(e.target.value)} placeholder="https://..." style={inputStyle} />
                    <button onClick={addInfoLink} className="py-2 rounded-xl" style={{ background: ACCENT, color: BG, fontWeight: 700, fontSize: 13 }}>＋ リンクを追加</button>
                  </div>
                </div>

                <h2 style={{ fontFamily: "'Fraunces', serif", fontWeight: 700, fontSize: 16, marginBottom: 8, color: ACCENT }}>IMAGES</h2>
                <div className="flex flex-col gap-3 mb-3">
                  {infoImages.map((img) => (
                    <div key={img.id} className="rounded-xl overflow-hidden" style={{ background: CARD, border: `1px solid ${BORDER}` }}>
                      <img src={img.src} alt={img.caption || "image"} className="w-full" />
                      <div className="flex items-center justify-between px-3 py-2">
                        <span style={{ fontSize: 11.5, color: MUTED }}>{img.caption}</span>
                        <button onClick={() => deleteInfoImage(img.id)} style={{ color: FAINT, fontSize: 12 }}>✕ 削除</button>
                      </div>
                    </div>
                  ))}
                </div>
                <label className="flex items-center justify-center gap-2 rounded-xl py-3 mb-8 cursor-pointer" style={{ background: CARD, border: "1px dashed #4A3C2C", color: FAINT, fontSize: 13 }}>
                  📷 画像を追加
                  <input type="file" accept="image/*" onChange={addInfoImage} className="hidden" />
                </label>

                <h2 style={{ fontFamily: "'Fraunces', serif", fontWeight: 700, fontSize: 16, marginBottom: 8, color: ACCENT }}>MEMO</h2>
                <div className="rounded-xl p-3 mb-3" style={{ background: CARD, border: `1px solid ${BORDER}` }}>
                  <textarea value={newNote} onChange={(e) => setNewNote(e.target.value)} rows={3} placeholder="気づいたことを自由にメモ" style={{ ...inputStyle, resize: "vertical" }} />
                  <button onClick={addInfoNote} className="mt-2 py-2 w-full rounded-xl" style={{ background: ACCENT, color: BG, fontWeight: 700, fontSize: 13 }}>＋ メモを追加</button>
                </div>
                <div className="flex flex-col gap-2">
                  {infoNotes.map((n) => (
                    <div key={n.id} className="rounded-xl p-3" style={{ background: CARD, border: `1px solid ${BORDER}` }}>
                      <div className="flex items-start justify-between gap-2">
                        <p style={{ fontSize: 13, whiteSpace: "pre-wrap", flex: 1 }}>{n.text}</p>
                        <button onClick={() => deleteInfoNote(n.id)} style={{ color: FAINT, fontSize: 12, flexShrink: 0 }}>✕</button>
                      </div>
                      <p style={{ fontSize: 10.5, color: FAINT, marginTop: 6 }}>{new Date(n.datetime).toLocaleString("ja-JP")}</p>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>
        </>
      )}

      {screen === "detail" && detail && (
        <div>
          <div className="relative w-full flex items-center justify-center" style={{ height: 260, background: CARD2 }}>
            <button onClick={() => setScreen("list")} className="absolute top-5 left-5 rounded-full flex items-center justify-center" style={{ width: 36, height: 36, background: "rgba(27,22,17,0.6)", color: TEXT }}>‹</button>
            {detail.photos && detail.photos[0] ? <img src={detail.photos[0]} alt={detail.name} className="w-full h-full object-cover" /> : <span style={{ fontSize: 34 }}>🍺</span>}
          </div>
          {detail.photos && detail.photos.filter((p, i) => i > 0 && p).length > 0 && (
            <div className="flex gap-2 px-5 pt-3">
              {detail.photos.filter((p, i) => i > 0 && p).map((p, i) => (
                <div key={i} className="rounded-lg overflow-hidden" style={{ width: 52, height: 52, background: CARD2, border: `1px solid ${BORDER}` }}>
                  <img src={p} alt="" className="w-full h-full object-cover" />
                </div>
              ))}
            </div>
          )}
          <div className="px-5 pt-5">
            <p style={{ color: ACCENT, fontSize: 12, fontWeight: 700, letterSpacing: "0.04em" }}>{(detail.brewery || "不明").toUpperCase()}</p>
            <h2 style={{ fontFamily: "'Fraunces', serif", fontWeight: 700, fontSize: 26, marginTop: 2 }}>{detail.name}</h2>
            {detail.impression && <p style={{ color: MUTED, fontSize: 14, marginTop: 8, lineHeight: 1.6 }}>{detail.impression}</p>}
            <button onClick={() => startEdit(detail)} className="flex items-center gap-1.5 mt-4" style={{ color: ACCENT, fontWeight: 700, fontSize: 14 }}>✎ Edit</button>
            <h3 style={{ fontFamily: "'Fraunces', serif", fontWeight: 700, fontSize: 18, marginTop: 20, marginBottom: 8 }}>Details</h3>
            <div className="grid grid-cols-2 gap-2">
              <Chip full label="RATING">
                <div className="flex items-center gap-2 mt-0.5">
                  <StarRating value={detail.rank} size={18} />
                  <span style={{ color: MUTED, fontSize: 12 }}>{detail.rank || 0}/5</span>
                </div>
              </Chip>
              <Chip label="STYLE" value={detail.style || "—"} />
              <Chip label="REGION" value={detail.region || "—"} />
              <Chip label="ABV" value={detail.abv ? `${detail.abv}%` : "—"} />
              <Chip label="IBU" value={detail.ibu || "—"} />
              <Chip label="COLOR" swatch={detail.srm} value={detail.colorLabel ? `${detail.colorLabel}${detail.srm ? ` (${detail.srm} SRM)` : ""}` : "—"} />
              <Chip label="ADJUNCTS" value={detail.adjuncts || "—"} />
              <Chip label="購入場所" value={detail.purchasePlace || "—"} />
              <Chip label="価格" value={detail.price ? `¥${detail.price}` : "—"} />
              <Chip label="日時" value={detail.datetime ? new Date(detail.datetime).toLocaleString("ja-JP") : "—"} />
              <Chip full label="WEBSITE">
                {detail.website ? <a href={detail.website} target="_blank" rel="noreferrer" style={{ color: ACCENT, fontSize: 13, fontWeight: 600 }}>{detail.website}</a> : <span style={{ fontSize: 13, fontWeight: 600 }}>—</span>}
              </Chip>
            </div>
            <button onClick={() => handleDelete(detail.id)} className="flex items-center justify-center gap-1.5 w-full py-3 rounded-xl mt-6 mb-4" style={{ border: "1px solid #5A2E22", color: "#D97757", fontSize: 13, fontWeight: 700 }}>🗑 削除する</button>
          </div>
        </div>
      )}

      {screen === "form" && (
        <div className="px-5 pt-6">
          <button onClick={() => setScreen("list")} className="flex items-center gap-1 mb-4" style={{ color: MUTED, fontSize: 13 }}>‹ 戻る</button>
          <h2 style={{ fontFamily: "'Fraunces', serif", fontWeight: 700, fontSize: 20 }} className="mb-4">{editingId ? "記録を編集" : "新しい一杯を記録"}</h2>
          <div className="flex flex-col gap-4">
            <div>
              <label style={{ fontSize: 12, color: MUTED, display: "block", marginBottom: 6 }}>写真(最大3枚・1枚目がメイン)</label>
              <div className="grid grid-cols-3 gap-2">
                {[0, 1, 2].map((i) => (
                  <label key={i} className="rounded-2xl flex items-center justify-center overflow-hidden cursor-pointer relative" style={{ height: 100, background: CARD, border: i === 0 ? `1.5px solid ${ACCENT}` : "1px dashed #4A3C2C" }}>
                    {form.photos[i] ? (
                      <img src={form.photos[i]} className="w-full h-full object-cover" alt={`preview-${i}`} />
                    ) : (
                      <div className="flex flex-col items-center gap-1" style={{ color: FAINT }}>
                        <span style={{ fontSize: 16 }}>📷</span>
                        <span style={{ fontSize: 10 }}>{i === 0 ? "メイン" : `写真${i + 1}`}</span>
                      </div>
                    )}
                    <input type="file" accept="image/*" onChange={(e) => handlePhoto(i, e)} className="hidden" />
                  </label>
                ))}
              </div>
            </div>

            <Field label="ビール名">
              <div className="flex gap-2">
                <input value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} placeholder="写真があれば空欄でもOK" style={inputStyle} />
                <button onClick={handleAutoFetch} disabled={fetching} className="shrink-0 rounded-xl flex items-center justify-center gap-1.5 px-3" style={{ background: fetching ? "#4A3C2C" : ACCENT, color: BG, fontWeight: 700, fontSize: 12.5 }}>
                  {fetching ? "…" : "自動取得"}
                </button>
              </div>
              <p style={{ fontSize: 11, color: FAINT, marginTop: 4 }}>
                {apiKey ? "写真のラベルを読み取ってビール名ごと自動推定します(3枚まで使用)。ビール名だけ手入力してもOKです。" : "自動取得には右上の⚙からAPIキーの登録が必要です。"}
              </p>
            </Field>

            <Field label="日時"><input type="datetime-local" value={form.datetime} onChange={(e) => setForm({ ...form, datetime: e.target.value })} style={inputStyle} /></Field>

            <Field label="評価">
              <div className="flex items-center gap-3">
                <StarRating value={form.rank} size={30} onChange={(v) => setForm({ ...form, rank: v })} />
              </div>
            </Field>

            <Field label="感想">
              <textarea value={form.impression} onChange={(e) => setForm({ ...form, impression: e.target.value })} rows={4} placeholder="香り、味わい、余韻など" style={{ ...inputStyle, resize: "vertical" }} />
            </Field>

            <div className="grid grid-cols-2 gap-3">
              <Field label="購入場所・店"><input value={form.purchasePlace} onChange={(e) => setForm({ ...form, purchasePlace: e.target.value })} placeholder="例: 成城石井" style={inputStyle} /></Field>
              <Field label="価格(円)"><input value={form.price} onChange={(e) => setForm({ ...form, price: e.target.value })} placeholder="例: 480" style={inputStyle} /></Field>
            </div>

            <div className="rounded-xl p-3" style={{ background: CARD, border: `1px solid ${BORDER}` }}>
              <p style={{ fontSize: 11, color: FAINT, marginBottom: 10 }}>自動取得した項目(手動で修正も可能です)</p>
              <div className="grid grid-cols-2 gap-3">
                <Field label="ブリューワリー"><input value={form.brewery} onChange={(e) => setForm({ ...form, brewery: e.target.value })} style={inputStyle} /></Field>
                <Field label="スタイル"><input value={form.style} onChange={(e) => setForm({ ...form, style: e.target.value })} style={inputStyle} /></Field>
                <Field label="地域"><input value={form.region} onChange={(e) => setForm({ ...form, region: e.target.value })} style={inputStyle} /></Field>
                <Field label="度数(%)"><input value={form.abv} onChange={(e) => setForm({ ...form, abv: e.target.value })} style={inputStyle} /></Field>
                <Field label="IBU(苦味値)"><input value={form.ibu} onChange={(e) => setForm({ ...form, ibu: e.target.value })} style={inputStyle} /></Field>
                <Field label="色(SRM)"><input value={form.srm} onChange={(e) => setForm({ ...form, srm: e.target.value })} style={inputStyle} /></Field>
                <Field label="色の説明"><input value={form.colorLabel} onChange={(e) => setForm({ ...form, colorLabel: e.target.value })} style={inputStyle} /></Field>
              </div>
              <div className="mt-3"><Field label="副原料"><input value={form.adjuncts} onChange={(e) => setForm({ ...form, adjuncts: e.target.value })} style={inputStyle} /></Field></div>
              <div className="mt-3"><Field label="公式サイト"><input value={form.website} onChange={(e) => setForm({ ...form, website: e.target.value })} style={inputStyle} /></Field></div>
            </div>

            {error && <p style={{ color: "#D97757", fontSize: 12 }}>{error}</p>}

            <button onClick={handleSave} className="py-3 rounded-xl mt-1" style={{ background: ACCENT, color: BG, fontWeight: 700, fontSize: 15 }}>
              {editingId ? "更新する" : "記録する"}
            </button>
          </div>
        </div>
      )}

      {screen === "list" && (
        <nav className="fixed bottom-0 left-0 right-0 flex items-center justify-around py-3" style={{ background: CARD, borderTop: `1px solid ${BORDER}` }}>
          <TabButton icon="▦" label="Collection" active={tab === "collection"} onClick={() => setTab("collection")} />
          <TabButton icon="★" label="Rating" active={tab === "rating"} onClick={() => setTab("rating")} />
          <TabButton icon="≡" label="Style" active={tab === "style"} onClick={() => setTab("style")} />
          <TabButton icon="ℹ" label="Info" active={tab === "info"} onClick={() => setTab("info")} />
        </nav>
      )}
    </div>
  );
}

function TabButton({ icon, label, active, onClick }) {
  return (
    <button onClick={onClick} className="flex flex-col items-center gap-1" style={{ color: active ? ACCENT : MUTED }}>
      <span style={{ fontSize: 18 }}>{icon}</span>
      <span style={{ fontSize: 10.5, fontWeight: 600 }}>{label}</span>
    </button>
  );
}
function Chip({ label, value, children, full, swatch }) {
  return (
    <div className={"rounded-xl p-2.5" + (full ? " col-span-2" : "")} style={{ background: CARD, border: `1px solid ${BORDER}` }}>
      <div className="flex items-center gap-1.5" style={{ color: FAINT, fontSize: 9.5, letterSpacing: "0.03em" }}>
        {swatch !== undefined && <span style={{ width: 9, height: 9, borderRadius: 3, background: srmToHex(swatch), border: `1px solid ${BORDER}`, display: "inline-block" }} />}
        {label}
      </div>
      {children ? children : <p style={{ fontSize: 13, fontWeight: 600, marginTop: 3 }}>{value}</p>}
    </div>
  );
}
function Field({ label, children }) {
  return (
    <div>
      <label style={{ fontSize: 12, color: MUTED, display: "block", marginBottom: 6 }}>{label}</label>
      {children}
    </div>
  );
}
const inputStyle = { width: "100%", background: CARD, border: `1px solid ${BORDER}`, borderRadius: 10, padding: "10px 12px", color: TEXT, fontSize: 14, outline: "none" };

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
