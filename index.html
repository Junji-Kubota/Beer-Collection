<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

/* ============ 見た目の定数 ============ */
const BG = "#1B1611", CARD = "#241D16", CARD2 = "#2E251B", BORDER = "#3A3024";
const ACCENT = "#E8A33D", TEXT = "#F2E8D5", MUTED = "#A89A82", FAINT = "#7A6C56";

/* ============ IndexedDBラッパー(window.storageの代わり) ============ */
const DB_NAME = "beer_journal_db";
const STORE = "kv";
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGet(key) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, "readonly");
    const req = tx.objectStore(STORE).get(key);
    req.onsuccess = () => resolve(req.result === undefined ? null : req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSet(key, value) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).put(value, key);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}

/* ============ 画像圧縮 ============ */
function compressImage(file, maxWidth = 380, quality = 0.55) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error);
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("画像の読み込みに失敗しました"));
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ============ 自分のAPIキーでClaudeに直接問い合わせ(ブラウザから直接) ============ */
async function fetchBeerInfo(name, apiKey) {
  const prompt = `あなたはクラフトビールのデータベース調査アシスタントです。ビール名「${name}」について、Web検索を使って以下の情報を調べ、JSONのみを出力してください（説明文やコードフェンスは一切不要）。

出力形式(すべて日本語、値が不明な場合は空文字 "" にする):
{
  "brewery": "醸造所名",
  "style": "ビアスタイル(例: PALE ALE, IPA, STOUT/PORTER, LAGERS など英語表記)",
  "region": "生産国または地域",
  "abv": "アルコール度数の数値のみ(例: 4.7)",
  "srm": "SRM値の数値のみ(例: 8)",
  "colorLabel": "色の簡潔な日本語表現(例: 非常に淡い, 淡い, 琥珀色, 濃い茶色, 黒に近い)",
  "adjuncts": "副原料があれば列挙、なければ特になし",
  "website": "公式サイトのURL、不明なら空文字"
}`;

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: "claude-haiku-4-5-20251001",
      max_tokens: 1000,
      messages: [{ role: "user", content: prompt }],
      tools: [{ type: "web_search_20250305", name: "web_search" }],
    }),
  });

  if (!response.ok) {
    const errText = await response.text().catch(() => "");
    throw new Error("APIエラー: " + response.status + " " + errText.slice(0, 200));
  }
  const data = await response.json();
  const text = (data.content || [])
    .map((b) => (b.type === "text" ? b.text : ""))
    .filter(Boolean)
    .join("\n");
  const clean = text.replace(/```json|```/g, "").trim();
  const m = clean.match(/\{[\s\S]*\}/);
  if (!m) throw new Error("情報を解析できませんでした");
  return JSON.parse(m[0]);
}

/* ============ グラスゲージ(評価) ============ */
function BeerGauge({ value, size = 22, onChange }) {
  const pct = Math.max(0, Math.min(1, value / 5));
  const fillHeight = 34 * pct;
  return (
    <div
      className="relative select-none shrink-0"
      style={{ width: size, height: size * 1.15 }}
      onClick={(e) => {
        if (!onChange) return;
        const rect = e.currentTarget.getBoundingClientRect();
        const relY = 1 - (e.clientY - rect.top) / rect.height;
        onChange(Math.max(1, Math.min(5, Math.round(relY * 5))));
      }}
    >
      <svg viewBox="0 0 40 46" width={size} height={size * 1.15}>
        <defs>
          <clipPath id={`glass-clip-${size}-${value}`}>
            <path d="M8 6 L32 6 L29 40 Q20 44 11 40 Z" />
          </clipPath>
        </defs>
        <rect x="8" y={40 - fillHeight} width="24" height={fillHeight} fill={ACCENT} clipPath={`url(#glass-clip-${size}-${value})`} />
        <path d="M8 6 L32 6 L29 40 Q20 44 11 40 Z" fill="none" stroke={TEXT} strokeWidth="1.6" />
      </svg>
    </div>
  );
}

function EyebrowRow({ brewery, style }) {
  return (
    <p className="truncate" style={{ fontSize: 10.5, fontWeight: 700, letterSpacing: "0.03em" }}>
      <span style={{ color: ACCENT }}>{brewery || "不明"}</span>
      {style && <span style={{ color: MUTED }}> / {style.toUpperCase()}</span>}
    </p>
  );
}

const EMPTY_FORM = {
  name: "", photo: "", datetime: "", impression: "", rank: 3,
  brewery: "", style: "", region: "", abv: "", srm: "", colorLabel: "", adjuncts: "", website: "",
};

function App() {
  const [beers, setBeers] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [tab, setTab] = useState("collection");
  const [screen, setScreen] = useState("list");
  const [form, setForm] = useState(EMPTY_FORM);
  const [editingId, setEditingId] = useState(null);
  const [detailId, setDetailId] = useState(null);
  const [error, setError] = useState("");
  const [fetching, setFetching] = useState(false);
  const [apiKey, setApiKey] = useState("");
  const [showKeyModal, setShowKeyModal] = useState(false);
  const [keyDraft, setKeyDraft] = useState("");

  useEffect(() => {
    (async () => {
      try {
        const stored = await idbGet("beers");
        if (stored) setBeers(JSON.parse(stored));
      } catch (e) { /* 初回は何もない */ }
      const key = localStorage.getItem("anthropic_api_key") || "";
      setApiKey(key);
      setLoaded(true);
    })();
  }, []);

  async function persist(next) {
    setBeers(next);
    try {
      await idbSet("beers", JSON.stringify(next));
      setError("");
    } catch (e) {
      setError("保存に失敗しました。ブラウザのストレージ設定をご確認ください。");
    }
  }

  function saveApiKey() {
    localStorage.setItem("anthropic_api_key", keyDraft.trim());
    setApiKey(keyDraft.trim());
    setShowKeyModal(false);
  }

  function startAdd() {
    setForm({ ...EMPTY_FORM, datetime: new Date().toISOString().slice(0, 16) });
    setEditingId(null);
    setError("");
    setScreen("form");
  }
  function startEdit(beer) {
    setForm({ ...beer });
    setEditingId(beer.id);
    setError("");
    setScreen("form");
  }
  function openDetail(id) {
    setDetailId(id);
    setScreen("detail");
  }

  async function handleAutoFetch() {
    if (!form.name.trim()) { setError("先にビール名を入力してください。"); return; }
    if (!apiKey) { setShowKeyModal(true); return; }
    setFetching(true);
    setError("");
    try {
      const info = await fetchBeerInfo(form.name.trim(), apiKey);
      setForm((f) => ({
        ...f,
        brewery: info.brewery || f.brewery,
        style: info.style || f.style,
        region: info.region || f.region,
        abv: info.abv || f.abv,
        srm: info.srm || f.srm,
        colorLabel: info.colorLabel || f.colorLabel,
        adjuncts: info.adjuncts || f.adjuncts,
        website: info.website || f.website,
      }));
    } catch (e) {
      setError("情報を取得できませんでした(" + e.message + ")。手動で入力してください。");
    } finally {
      setFetching(false);
    }
  }

  async function handleSave() {
    if (!form.name.trim()) { setError("ビール名を入力してください。"); return; }
    const next = editingId
      ? beers.map((b) => (b.id === editingId ? { ...form, id: editingId } : b))
      : [{ ...form, id: "beer_" + Date.now() }, ...beers];
    await persist(next);
    setScreen("list");
  }
  async function handleDelete(id) {
    await persist(beers.filter((b) => b.id !== id));
    setScreen("list");
  }
  async function handlePhoto(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    try {
      const compressed = await compressImage(file);
      setForm((f) => ({ ...f, photo: compressed }));
    } catch (err) {
      setError("画像の処理に失敗しました。別の写真でお試しください。");
    }
  }

  const byRating = useMemo(() => {
    const groups = {};
    beers.forEach((b) => { const k = b.rank || 0; (groups[k] = groups[k] || []).push(b); });
    return Object.keys(groups).sort((a, b) => b - a).map((k) => ({ key: k, items: groups[k] }));
  }, [beers]);

  const byStyle = useMemo(() => {
    const groups = {};
    beers.forEach((b) => { const k = (b.style || "未分類").toUpperCase(); (groups[k] = groups[k] || []).push(b); });
    return Object.keys(groups).sort().map((k) => ({ key: k, items: groups[k] }));
  }, [beers]);

  const detail = beers.find((b) => b.id === detailId);

  return (
    <div style={{ minHeight: "100vh", background: BG, color: TEXT, fontFamily: "'Work Sans', sans-serif", paddingBottom: 80 }}>

      {showKeyModal && (
        <div className="fixed inset-0 z-50 flex items-center justify-center px-6" style={{ background: "rgba(0,0,0,0.6)" }}>
          <div className="w-full rounded-2xl p-5" style={{ background: CARD, border: `1px solid ${BORDER}`, maxWidth: 380 }}>
            <h3 style={{ fontFamily: "'Fraunces', serif", fontWeight: 700, fontSize: 18 }}>Anthropic APIキー</h3>
            <p style={{ fontSize: 12, color: MUTED, marginTop: 6, lineHeight: 1.6 }}>
              「自動取得」機能を使うには、ご自身のAnthropic APIキーが必要です。console.anthropic.com で発行できます。キーはこの端末のブラウザ内にのみ保存され、外部には送信されません。
            </p>
            <input
              value={keyDraft}
              onChange={(e) => setKeyDraft(e.target.value)}
              placeholder="sk-ant-..."
              style={{ width: "100%", background: CARD2, border: `1px solid ${BORDER}`, borderRadius: 10, padding: "10px 12px", color: TEXT, fontSize: 13, marginTop: 12, outline: "none" }}
            />
            <div className="flex gap-2 mt-4">
              <button onClick={() => setShowKeyModal(false)} className="flex-1 py-2.5 rounded-xl" style={{ background: CARD2, color: TEXT, fontSize: 13, fontWeight: 600 }}>
                キャンセル
              </button>
              <button onClick={saveApiKey} className="flex-1 py-2.5 rounded-xl" style={{ background: ACCENT, color: BG, fontSize: 13, fontWeight: 700 }}>
                保存
              </button>
            </div>
          </div>
        </div>
      )}

      {screen === "list" && (
        <>
          <header className="px-5 pt-6 pb-4 sticky top-0 z-10" style={{ background: `linear-gradient(180deg, ${BG} 75%, rgba(27,22,17,0))` }}>
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2">
                <span style={{ fontSize: 22 }}>🍺</span>
                <h1 style={{ fontFamily: "'Fraunces', serif", fontWeight: 700, fontSize: 24 }}>
                  {tab === "collection" ? "Collection" : tab === "rating" ? "By Rating" : "By Style"}
                </h1>
              </div>
              <div className="flex items-center gap-2">
                <button onClick={() => { setKeyDraft(apiKey); setShowKeyModal(true); }} className="flex items-center justify-center rounded-full" style={{ width: 34, height: 34, background: CARD, border: `1px solid ${BORDER}`, color: MUTED, fontSize: 14 }} title="APIキー設定">
                  ⚙
                </button>
                <button onClick={startAdd} className="flex items-center gap-1 rounded-full" style={{ background: ACCENT, color: BG, fontWeight: 700, fontSize: 13, padding: "8px 14px" }}>
                  ＋ New
                </button>
              </div>
            </div>
            {beers.length > 0 && (
              <p style={{ color: MUTED, fontSize: 11, marginTop: 10 }}>{beers.length}杯 記録済み</p>
            )}
          </header>

          <main className="px-5">
            {!loaded && <p style={{ color: MUTED, fontSize: 13 }}>読み込み中…</p>}

            {loaded && beers.length === 0 && (
              <div className="mt-16 text-center" style={{ color: FAINT }}>
                <div style={{ fontSize: 40, opacity: 0.5, marginBottom: 12 }}>🍺</div>
                <p style={{ fontFamily: "'Fraunces', serif", fontSize: 18, color: MUTED }}>まだ記録がありません</p>
                <p style={{ fontSize: 13, marginTop: 4 }}>右上の ＋New から最初の一杯を記録しましょう</p>
              </div>
            )}

            {loaded && beers.length > 0 && tab === "collection" && (
              <div className="grid grid-cols-2 gap-3">
                {beers.map((b) => (
                  <button key={b.id} onClick={() => openDetail(b.id)} className="text-left rounded-2xl overflow-hidden" style={{ background: CARD, border: `1px solid ${BORDER}` }}>
                    <div className="w-full flex items-center justify-center" style={{ height: 110, background: CARD2 }}>
                      {b.photo ? <img src={b.photo} alt={b.name} className="w-full h-full object-cover" /> : <span style={{ fontSize: 22 }}>🍺</span>}
                    </div>
                    <div className="p-2.5">
                      <EyebrowRow brewery={b.brewery} />
                      <p className="truncate" style={{ fontFamily: "'Fraunces', serif", fontWeight: 700, fontSize: 15, marginTop: 2 }}>{b.name}</p>
                    </div>
                  </button>
                ))}
              </div>
            )}

            {loaded && beers.length > 0 && tab === "rating" && byRating.map((group) => (
              <div key={group.key} className="mb-5">
                <h2 style={{ fontFamily: "'Fraunces', serif", fontWeight: 700, fontSize: 22, marginBottom: 8 }}>{group.key}</h2>
                <div className="flex flex-col">
                  {group.items.map((b) => (
                    <button key={b.id} onClick={() => openDetail(b.id)} className="flex items-center gap-3 py-3 text-left" style={{ borderBottom: `1px solid ${BORDER}` }}>
                      <div className="shrink-0 rounded-xl overflow-hidden flex items-center justify-center" style={{ width: 48, height: 48, background: CARD2 }}>
                        {b.photo ? <img src={b.photo} alt={b.name} className="w-full h-full object-cover" /> : <span>🍺</span>}
                      </div>
                      <div className="flex-1 min-w-0">
                        <EyebrowRow brewery={b.brewery} style={b.style} />
                        <p className="truncate" style={{ fontWeight: 700, fontSize: 15 }}>{b.name}</p>
                        {b.impression && <p className="truncate" style={{ color: MUTED, fontSize: 12.5 }}>{b.impression}</p>}
                      </div>
                    </button>
                  ))}
                </div>
              </div>
            ))}

            {loaded && beers.length > 0 && tab === "style" && byStyle.map((group) => (
              <div key={group.key} className="mb-5">
                <h2 style={{ fontFamily: "'Fraunces', serif", fontWeight: 700, fontSize: 18, marginBottom: 8, color: ACCENT }}>{group.key}</h2>
                <div className="flex flex-col">
                  {group.items.map((b) => (
                    <button key={b.id} onClick={() => openDetail(b.id)} className="flex items-center gap-3 py-3 text-left" style={{ borderBottom: `1px solid ${BORDER}` }}>
                      <div className="shrink-0 rounded-xl overflow-hidden flex items-center justify-center" style={{ width: 48, height: 48, background: CARD2 }}>
                        {b.photo ? <img src={b.photo} alt={b.name} className="w-full h-full object-cover" /> : <span>🍺</span>}
                      </div>
                      <div className="flex-1 min-w-0">
                        <p className="truncate" style={{ color: MUTED, fontSize: 11 }}>{b.brewery || "不明"}</p>
                        <p className="truncate" style={{ fontWeight: 700, fontSize: 15 }}>{b.name}</p>
                      </div>
                      <BeerGauge value={b.rank} size={18} />
                    </button>
                  ))}
                </div>
              </div>
            ))}
          </main>
        </>
      )}

      {screen === "detail" && detail && (
        <div>
          <div className="relative w-full flex items-center justify-center" style={{ height: 260, background: CARD2 }}>
            <button onClick={() => setScreen("list")} className="absolute top-5 left-5 rounded-full flex items-center justify-center" style={{ width: 36, height: 36, background: "rgba(27,22,17,0.6)", color: TEXT }}>‹</button>
            {detail.photo ? <img src={detail.photo} alt={detail.name} className="w-full h-full object-cover" /> : <span style={{ fontSize: 34 }}>🍺</span>}
          </div>
          <div className="px-5 pt-5">
            <p style={{ color: ACCENT, fontSize: 12, fontWeight: 700, letterSpacing: "0.04em" }}>{(detail.brewery || "不明").toUpperCase()}</p>
            <h2 style={{ fontFamily: "'Fraunces', serif", fontWeight: 700, fontSize: 26, marginTop: 2 }}>{detail.name}</h2>
            {detail.impression && <p style={{ color: MUTED, fontSize: 14, marginTop: 8, lineHeight: 1.6 }}>{detail.impression}</p>}
            <button onClick={() => startEdit(detail)} className="flex items-center gap-1.5 mt-4" style={{ color: ACCENT, fontWeight: 700, fontSize: 14 }}>✎ Edit</button>
            <h3 style={{ fontFamily: "'Fraunces', serif", fontWeight: 700, fontSize: 18, marginTop: 20, marginBottom: 4 }}>Details</h3>
            <div>
              <DetailRow label="Rating" value={<BeerGauge value={detail.rank} size={20} />} isNode />
              <DetailRow label="日時" value={detail.datetime ? new Date(detail.datetime).toLocaleString("ja-JP") : "—"} />
              <DetailRow label="Region" value={detail.region || "—"} />
              <DetailRow label="Style" value={detail.style || "—"} />
              <DetailRow label="Brewery" value={detail.brewery || "—"} />
              <DetailRow label="Color" value={detail.colorLabel ? `${detail.colorLabel}${detail.srm ? ` (${detail.srm} SRM)` : ""}` : "—"} />
              <DetailRow label="ABV" value={detail.abv ? `${detail.abv}%` : "—"} />
              <DetailRow label="Adjuncts" value={detail.adjuncts || "—"} />
              <DetailRow label="Website" isNode value={detail.website ? <a href={detail.website} target="_blank" rel="noreferrer" style={{ color: ACCENT }}>{detail.website}</a> : "—"} />
            </div>
            <button onClick={() => handleDelete(detail.id)} className="flex items-center justify-center gap-1.5 w-full py-3 rounded-xl mt-6 mb-4" style={{ border: "1px solid #5A2E22", color: "#D97757", fontSize: 13, fontWeight: 700 }}>🗑 削除する</button>
          </div>
        </div>
      )}

      {screen === "form" && (
        <div className="px-5 pt-6">
          <button onClick={() => setScreen("list")} className="flex items-center gap-1 mb-4" style={{ color: MUTED, fontSize: 13 }}>‹ 戻る</button>
          <h2 style={{ fontFamily: "'Fraunces', serif", fontWeight: 700, fontSize: 20 }} className="mb-4">{editingId ? "記録を編集" : "新しい一杯を記録"}</h2>
          <div className="flex flex-col gap-4">
            <label className="rounded-2xl flex items-center justify-center overflow-hidden cursor-pointer" style={{ height: 140, background: CARD, border: "1px dashed #4A3C2C" }}>
              {form.photo ? <img src={form.photo} className="w-full h-full object-cover" alt="preview" /> : (
                <div className="flex flex-col items-center gap-1" style={{ color: FAINT }}>
                  <span style={{ fontSize: 20 }}>📷</span>
                  <span style={{ fontSize: 12 }}>写真を選択</span>
                </div>
              )}
              <input type="file" accept="image/*" onChange={handlePhoto} className="hidden" />
            </label>

            <Field label="ビール名 *">
              <div className="flex gap-2">
                <input value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} placeholder="例: よなよなエール" style={inputStyle} />
                <button onClick={handleAutoFetch} disabled={fetching} className="shrink-0 rounded-xl flex items-center justify-center gap-1.5 px-3" style={{ background: fetching ? "#4A3C2C" : ACCENT, color: BG, fontWeight: 700, fontSize: 12.5 }}>
                  {fetching ? "…" : "自動取得"}
                </button>
              </div>
              <p style={{ fontSize: 11, color: FAINT, marginTop: 4 }}>
                {apiKey ? "ビール名を入力して「自動取得」を押すと、ブリューワリー・スタイル・色・度数などをネットで調べて自動入力します。" : "自動取得には右上の⚙からAPIキーの登録が必要です。"}
              </p>
            </Field>

            <Field label="日時"><input type="datetime-local" value={form.datetime} onChange={(e) => setForm({ ...form, datetime: e.target.value })} style={inputStyle} /></Field>

            <Field label="評価">
              <div className="flex items-center gap-3">
                <BeerGauge value={form.rank} size={44} onChange={(v) => setForm({ ...form, rank: v })} />
                <span style={{ fontSize: 12, color: MUTED }}>タップして高さを調整(1〜5)</span>
              </div>
            </Field>

            <Field label="感想">
              <textarea value={form.impression} onChange={(e) => setForm({ ...form, impression: e.target.value })} rows={4} placeholder="香り、味わい、余韻など" style={{ ...inputStyle, resize: "vertical" }} />
            </Field>

            <div className="rounded-xl p-3" style={{ background: CARD, border: `1px solid ${BORDER}` }}>
              <p style={{ fontSize: 11, color: FAINT, marginBottom: 10 }}>自動取得した項目(手動で修正も可能です)</p>
              <div className="grid grid-cols-2 gap-3">
                <Field label="ブリューワリー"><input value={form.brewery} onChange={(e) => setForm({ ...form, brewery: e.target.value })} style={inputStyle} /></Field>
                <Field label="スタイル"><input value={form.style} onChange={(e) => setForm({ ...form, style: e.target.value })} style={inputStyle} /></Field>
                <Field label="地域"><input value={form.region} onChange={(e) => setForm({ ...form, region: e.target.value })} style={inputStyle} /></Field>
                <Field label="度数(%)"><input value={form.abv} onChange={(e) => setForm({ ...form, abv: e.target.value })} style={inputStyle} /></Field>
                <Field label="色(SRM)"><input value={form.srm} onChange={(e) => setForm({ ...form, srm: e.target.value })} style={inputStyle} /></Field>
                <Field label="色の説明"><input value={form.colorLabel} onChange={(e) => setForm({ ...form, colorLabel: e.target.value })} style={inputStyle} /></Field>
              </div>
              <div className="mt-3"><Field label="副原料"><input value={form.adjuncts} onChange={(e) => setForm({ ...form, adjuncts: e.target.value })} style={inputStyle} /></Field></div>
              <div className="mt-3"><Field label="公式サイト"><input value={form.website} onChange={(e) => setForm({ ...form, website: e.target.value })} style={inputStyle} /></Field></div>
            </div>

            {error && <p style={{ color: "#D97757", fontSize: 12 }}>{error}</p>}

            <button onClick={handleSave} className="py-3 rounded-xl mt-1" style={{ background: ACCENT, color: BG, fontWeight: 700, fontSize: 15 }}>
              {editingId ? "更新する" : "記録する"}
            </button>
          </div>
        </div>
      )}

      {screen === "list" && (
        <nav className="fixed bottom-0 left-0 right-0 flex items-center justify-around py-3" style={{ background: CARD, borderTop: `1px solid ${BORDER}` }}>
          <TabButton icon="▦" label="Collection" active={tab === "collection"} onClick={() => setTab("collection")} />
          <TabButton icon="★" label="Rating" active={tab === "rating"} onClick={() => setTab("rating")} />
          <TabButton icon="≡" label="Style" active={tab === "style"} onClick={() => setTab("style")} />
        </nav>
      )}
    </div>
  );
}

function TabButton({ icon, label, active, onClick }) {
  return (
    <button onClick={onClick} className="flex flex-col items-center gap-1" style={{ color: active ? ACCENT : MUTED }}>
      <span style={{ fontSize: 18 }}>{icon}</span>
      <span style={{ fontSize: 10.5, fontWeight: 600 }}>{label}</span>
    </button>
  );
}
function DetailRow({ label, value, isNode }) {
  return (
    <div className="flex items-center justify-between py-3" style={{ borderBottom: `1px solid ${BORDER}` }}>
      <span style={{ color: MUTED, fontSize: 14 }}>{label}</span>
      {isNode ? value : <span style={{ fontSize: 14, fontWeight: 500, textAlign: "right" }}>{value}</span>}
    </div>
  );
}
function Field({ label, children }) {
  return (
    <div>
      <label style={{ fontSize: 12, color: MUTED, display: "block", marginBottom: 6 }}>{label}</label>
      {children}
    </div>
  );
}
const inputStyle = { width: "100%", background: CARD, border: `1px solid ${BORDER}`, borderRadius: 10, padding: "10px 12px", color: TEXT, fontSize: 14, outline: "none" };

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
